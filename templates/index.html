<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366F1">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2693/2693507.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2693/2693507.png">
    <title>Календариус – Календарь задач</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-card">
            <h1>Календариус</h1>
            <p>Планируй. Фокусируйся. Достигай</p>
            <button id="btn-start" class="btn-primary" style="width: 100%; margin-top: 20px;">Начать планирование</button>
            <div class="divider">или</div>
            <button class="btn-google">Войти через Google</button>
        </div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">Календариус</div>
            <button class="btn-primary" id="btn-new-task">+ Новая задача</button>
            <nav class="menu">
                <ul>
                    <li id="menu-today">Сегодня <span class="badge" id="today-badge"></span></li>
                    <li id="menu-calendar" class="active">Календарь</li>
                </ul>
            </nav>
            <div class="lists">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">Мои списки</h3>
                    <button id="btn-add-list" style="border:none; background:none; cursor:pointer; color:var(--primary); font-size:18px; font-weight:bold;">+</button>
                </div>
                <ul id="custom-lists">
                    <li class="list-item" data-val="work"><span class="dot work"></span> Работа</li>
                    <li class="list-item" data-val="study"><span class="dot study"></span> Учёба</li>
                    <li class="list-item" data-val="personal"><span class="dot personal"></span> Личное</li>
                </ul>
                <p class="hint-text" style="font-size: 10px; margin-top: 10px;">Двойной клик по списку удалит его</p>
            </div>
        </aside>

        <main class="calendar-area">
            <header class="calendar-header">
                <div class="date-controls">
                    <button class="btn-icon">&lt;</button>
                    <button class="btn-icon">&gt;</button>
                    <button class="btn-today">Сегодня</button>
                    <h2>Май 2026</h2>
                </div>
                <div class="view-controls">
                    <button>День</button>
                    <button class="active">Неделя</button>
                    <button>Месяц</button>
                </div>
            </header>
            
            <div class="calendar-grid" id="calendar-grid">
                <div class="time-column" id="time-column">
                    </div>
                <div class="days-container">
                </div>
            </div>
        </main>

        <aside class="right-sidebar">
            <h3>Незавершённые задачи</h3>
            <p class="hint-text">Подсказка: дважды кликните по задаче, чтобы удалить её</p>
            <div class="unassigned-tasks" id="unassigned-tasks">
                </div>
        </aside>
    </div>

    <div id="task-modal" class="welcome-screen hidden">
        <div class="welcome-card" style="text-align: left;">
            <h2 style="margin-bottom: 20px;">Новая задача</h2>
            
            <label style="display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 14px;">Название задачи</label>
            <input type="text" id="new-task-title" placeholder="Например: Подготовиться к экзамену" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 6px;">

            <label style="display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 14px;">Категория</label>
            <select id="new-task-category" style="width: 100%; padding: 10px; margin-bottom: 30px; border: 1px solid var(--border-color); border-radius: 6px;">
                <option value="work">Работа</option>
                <option value="study">Учёба</option>
                <option value="personal">Личное</option>
            </select>
            
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="btn-cancel-task" style="padding: 10px 15px; border: none; background: #E2E8F0; border-radius: 6px; cursor: pointer;">Отмена</button>
                <button id="btn-save-task" class="btn-primary">Добавить задачу</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
